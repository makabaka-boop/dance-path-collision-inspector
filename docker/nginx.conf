server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
